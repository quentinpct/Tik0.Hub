<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porte-documents Tik0.Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Tik0.Hub</h1>
  <a class="back show" href="index.html">← Retour au menu</a>
</header>

<section class="page active" id="page-docs">
  <h2>Porte-documents</h2>
  <input type="file" id="fileInput" onchange="addDoc()">
  <ul id="docList"></ul>
  <p style="font-size:12px;color:#777;">⚠️ Les fichiers restent affichés tant que tu ne quittes pas cette page (une vraie sauvegarde de fichiers nécessite un serveur).</p>
</section>

<script>
  let docs = [];

  function addDoc() {
    const input = document.getElementById("fileInput");
    const file = input.files[0];
    if (!file) return;

    docs.push({
      name: file.name,
      url: URL.createObjectURL(file)
    });

    input.value = "";
    renderDocs();
  }

  function deleteDoc(index) {
    docs.splice(index, 1);
    renderDocs();
  }

  function renderDocs() {
    const list = document.getElementById("docList");
    list.innerHTML = "";

    docs.forEach(function (doc, index) {
      const li = document.createElement("li");
      li.innerHTML =
        '<a href="' + doc.url + '" download="' + doc.name + '">' + doc.name + "</a>" +
        '<span class="del" onclick="deleteDoc(' + index + ')">supprimer</span>';
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
