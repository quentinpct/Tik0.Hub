<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tik0.Hub</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="db.js"></script>
</head>
<body class="hide-until-auth">

<header class="topbar">
  <h1>Tik0.Hub</h1>
  <div class="topbar-right">
    <button class="logout-btn" onclick="logout()">Déconnexion</button>
  </div>
</header>

<!-- Petit résumé flottant des tâches en cours, en haut à gauche -->
<div id="todoWidget">
  <h4>À faire <span class="count" id="todoWidgetCount">0</span></h4>
  <ul id="todoWidgetList"></ul>
</div>

<section class="page active" id="page-home">
  <div class="menu-grid">

    <!-- Visible pour tout le monde (owner + amis) : emplois du temps -->
    <a class="menu-btn" href="https://edtweb.univ-cotedazur.fr/direct/index.jsp?code=TBRCA2-220-VET&login=Individuel&password=UlgkTGjrh69e&showTree=false&displayConfName=VisuV&projectId=6" target="_blank">
      Emploi du temps Cours
    </a>

    <a class="menu-btn" href="PlanningN1.pdf">Emploi du temps Entreprise</a>

    <!-- Cette partie n'est ajoutée dans la page que si le compte est "owner" -->
    <!-- display:contents rend ce conteneur invisible pour la mise en page,
         pour que le bouton à l'intérieur s'aligne comme les autres -->
    <div id="ownerOnlyMenu" style="display:contents;"></div>

    <!-- Visible pour tout le monde : chacun a sa propre to-do list -->
    <a class="menu-btn" href="todo.html">To do</a>

  </div>
</section>

<script>
  // On ajoute les boutons réservés au compte principal, et on charge
  // le résumé des tâches, seulement une fois la connexion confirmée.
  requireLogin(function () {

    if (isOwner()) {
      document.getElementById("ownerOnlyMenu").innerHTML = `
        <a class="menu-btn" href="https://outlook.cloud.microsoft/mail/?realm=unice.fr#path=/mail" target="_blank">Messagerie</a>
      `;
    }

    initWidget();
  });

  // Résumé des tâches en cours (propre au type de compte connecté),
  // affiché en haut à gauche sur toutes les visites du menu.
  const TODO_FIELD = "todos_" + getRole();
  let widgetTodos = [];

  async function toggleWidgetTodo(index) {
    widgetTodos[index].done = !widgetTodos[index].done;
    await saveField(TODO_FIELD, widgetTodos);
    renderWidget();
  }

  function renderWidget() {
    const pending = widgetTodos.filter(t => !t.done);
    document.getElementById("todoWidgetCount").textContent = pending.length;

    const list = document.getElementById("todoWidgetList");
    list.innerHTML = "";

    if (widgetTodos.length === 0) {
      list.innerHTML = "<li class='empty'>Rien à faire 🎉</li>";
      return;
    }

    widgetTodos.forEach(function (todo, index) {
      const li = document.createElement("li");
      if (todo.done) li.classList.add("done");
      li.innerHTML =
        '<input type="checkbox" ' + (todo.done ? "checked" : "") + ' onchange="toggleWidgetTodo(' + index + ')">' +
        "<label>" + todo.text + "</label>";
      list.appendChild(li);
    });
  }

  async function initWidget() {
    widgetTodos = await loadField(TODO_FIELD, []);
    renderWidget();
  }
</script>

</body>
</html>
