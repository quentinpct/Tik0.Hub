<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloc-notes Tik0.Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Tik0.Hub</h1>
  <a class="back show" href="index.html">← Retour au menu</a>
</header>

<section class="page active" id="page-notes">
  <h2>Bloc-notes</h2>
  <textarea id="notesText" placeholder="Écris tes notes ici..."></textarea>
</section>

<script>
  const zone = document.getElementById("notesText");
  zone.value = localStorage.getItem("notesText") || "";

  zone.addEventListener("input", function () {
    localStorage.setItem("notesText", zone.value);
  });
</script>

</body>
</html>
