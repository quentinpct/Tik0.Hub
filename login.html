<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Tik0.Hub </title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
</head>
<body>

<header class="topbar">
  <h1>Tik0.Hub</h1>
</header>

<section class="page active" id="page-login">
  <div class="login-box">
    <h2>Connexion</h2>
    <input type="password" id="pwd" placeholder="Mot de passe" onkeydown="if(event.key==='Enter') doLogin()">
    <button onclick="doLogin()">Se connecter</button>
    <p id="error" class="login-error"></p>
  </div>
</section>

<script>
  // Cette page demande TOUJOURS le mot de passe, même si on était
  // déjà connecté avant (pas de raccourci automatique).

  async function doLogin() {
    const value = document.getElementById("pwd").value;
    const role = await tryLogin(value); // vérifié par Firebase Authentication

    if (role) {
      window.location.href = "index.html";
    } else {
      document.getElementById("error").textContent = "Mot de passe incorrect.";
    }
  }
</script>

</body>
</html>
